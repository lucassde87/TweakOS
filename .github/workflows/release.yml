name: TweakOS Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: .NET installieren
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: TweakOS bauen
        run: dotnet publish src/TweakOS/TweakOS.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: ZIP erstellen
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath TweakOS-win-x64.zip

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: TweakOS-win-x64.zip
          generate_release_notes: true
