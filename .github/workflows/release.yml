name: TweakOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: .NET installieren
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: TweakOS bauen
        run: dotnet publish src/TweakOS/TweakOS.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Version ermitteln
        id: version
        shell: pwsh
        run: |
          $version = "1.0.0"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Tag erstellen
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag

      - name: ZIP erstellen
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath TweakOS-win-x64.zip

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: TweakOS-win-x64.zip
          generate_release_notes: true
