name: ChugOS Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:

      # ==============================
      # CODE HERUNTERLADEN
      # ==============================

      - name: Checkout
        uses: actions/checkout@v4


      # ==============================
      # .NET INSTALLIEREN
      # ==============================

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'


      # ==============================
      # VERSION AUS version.txt LESEN
      # ==============================

      - name: Read Version
        id: version
        shell: pwsh
        run: |

          $file = "version.txt"

          if (!(Test-Path $file)) {
              throw "version.txt wurde nicht gefunden."
          }

          $version = (Get-Content $file -Raw).Trim()

          Write-Host "Gefundene Version: $version"

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Ungültige Version in version.txt: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT


      # ==============================
      # PRÜFEN OB RELEASE EXISTIERT
      # ==============================

      - name: Check existing release
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"

          Write-Host "Prüfe Release $tag ..."

          $ErrorActionPreference = "Continue"

          gh release view $tag 2>$null

          if ($LASTEXITCODE -eq 0) {

              Write-Host "Release $tag existiert bereits."

              "exists=true" >> $env:GITHUB_OUTPUT

          }
          else {

              Write-Host "Release $tag existiert noch nicht."

              "exists=false" >> $env:GITHUB_OUTPUT

          }

          exit 0


      # ==============================
      # CHUGOS BAUEN
      # EINZELNE EXE
      # ==============================

      - name: Build ChugOS
        if: steps.release_check.outputs.exists != 'true'

        run: |

          dotnet publish src/ChugOS/ChugOS.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish


      # ==============================
      # EXE PRÜFEN
      # ==============================

      - name: Verify EXE
        if: steps.release_check.outputs.exists != 'true'

        shell: pwsh

        run: |

          $exe = "publish/ChugOS.exe"

          if (!(Test-Path $exe)) {

              Write-Host "Publish-Dateien:"

              Get-ChildItem publish

              throw "ChugOS.exe wurde nicht erstellt."

          }

          $size = (Get-Item $exe).Length / 1MB

          Write-Host ""
          Write-Host "=============================="
          Write-Host "ChugOS.exe erfolgreich erstellt"
          Write-Host "Größe: $([math]::Round($size,2)) MB"
          Write-Host "=============================="


      # ==============================
      # GITHUB RELEASE ERSTELLEN
      # ==============================

      - name: Create GitHub Release
        if: steps.release_check.outputs.exists != 'true'

        uses: softprops/action-gh-release@v2

        with:

          tag_name: v${{ steps.version.outputs.version }}

          name: ChugOS v${{ steps.version.outputs.version }}

          body: |

            ## ChugOS v${{ steps.version.outputs.version }}

            Neue Version von ChugOS.

            ### Download

            ChugOS.exe

            Einzelne Windows-EXE.
            Keine ZIP-Datei.

          files: publish/ChugOS.exe

          generate_release_notes: true
