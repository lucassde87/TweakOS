name: TweakOS Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read Version
        id: version
        shell: pwsh
        run: |
          $file = "src/TweakOS/Services/ReleaseService.cs"

          $content = Get-Content $file -Raw

          if ($content -match 'CurrentVersion\s*=\s*"([^"]+)"') {
              $version = $matches[1]
          }
          else {
              throw "CurrentVersion wurde nicht gefunden."
          }

          Write-Host "TweakOS Version: $version"

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check existing release
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"

          $release = gh release view $tag 2>$null

          if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $tag existiert bereits."
              "exists=true" >> $env:GITHUB_OUTPUT
          }
          else {
              Write-Host "Release $tag existiert noch nicht."
              "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build TweakOS
        if: steps.release_check.outputs.exists != 'true'
        run: |
          dotnet publish src/TweakOS/TweakOS.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o publish

      - name: Create ZIP
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path publish\* `
            -DestinationPath TweakOS-win-x64.zip `
            -Force

      - name: Create GitHub Release
        if: steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TweakOS v${{ steps.version.outputs.version }}
          body: |
            ## TweakOS v${{ steps.version.outputs.version }}

            Neues TweakOS Release.

            ### Download

            - TweakOS-win-x64.zip

            Dieses Release wurde automatisch von GitHub Actions erstellt.
          files: TweakOS-win-x64.zip
          generate_release_notes: true
