name: ChugOS Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read Version
        id: version
        shell: pwsh
        run: |
          $file = "version.txt"

          if (!(Test-Path $file)) {
              throw "version.txt wurde nicht gefunden."
          }

          $version = (Get-Content $file -Raw).Trim()

          Write-Host "Gefundene Version: $version"

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Ungültige Version in version.txt: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build ChugOS
        run: |
          dotnet publish src/ChugOS/ChugOS.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "publish/ChugOS.exe"

          if (!(Test-Path $exe)) {
              Write-Host "Publish-Dateien:"
              Get-ChildItem publish
              throw "ChugOS.exe wurde nicht erstellt."
          }

          $size = (Get-Item $exe).Length / 1MB

          Write-Host "=============================="
          Write-Host "ChugOS.exe erfolgreich erstellt"
          Write-Host "Größe: $([math]::Round($size,2)) MB"
          Write-Host "=============================="

      - name: Create or Update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"

          Write-Host "Release: $tag"

          gh release view $tag 2>$null

          if ($LASTEXITCODE -eq 0) {

              Write-Host "Release existiert bereits."
              Write-Host "ChugOS.exe wird aktualisiert."

              gh release upload $tag `
                "publish/ChugOS.exe" `
                --clobber

          } else {

              Write-Host "Release existiert noch nicht."
              Write-Host "Erstelle neues Release."

              gh release create $tag `
                "publish/ChugOS.exe" `
                --title "ChugOS v$version" `
                --notes "Neue Version von ChugOS.`n`nChugOS.exe - Windows x64"

          }
