</div>

<script>

const SUPABASE_URL =
"https://bnrawlkikbqkvdtkaauz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VwtyXd-NuH_G4iwqb6WpqQ_BYZNlv2B";

const VERSION_URL =
"https://raw.githubusercontent.com/lucassde87/TweakOS/main/version.txt";

let accessToken = null;
let editingId = null;


// ==========================================
// VERSION LADEN
// ==========================================

async function loadVersion() {

    const versionInput =
        document.getElementById("version");

    try {

        versionInput.value =
            "Version wird geladen...";


        const response = await fetch(
            VERSION_URL +
            "?t=" +
            Date.now()
        );


        if (!response.ok) {

            throw new Error(
                "version.txt konnte nicht geladen werden."
            );
        }


        let version =
            (await response.text()).trim();


        if (!version) {

            throw new Error(
                "version.txt ist leer."
            );
        }


        if (!version.startsWith("v")) {
            version = "v" + version;
        }


        versionInput.value =
            version;

    }

    catch (error) {

        versionInput.value =
            "Version konnte nicht geladen werden.";

        document
            .getElementById("status")
            .textContent =
            "Fehler bei version.txt: " +
            error.message;
    }

}


// ==========================================
// LOGIN
// ==========================================

async function adminLogin() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const status =
        document.getElementById("loginStatus");


    if (!email || !password) {

        status.textContent =
            "Bitte E-Mail und Passwort eingeben.";

        return;
    }


    status.textContent =
        "Login...";


    try {

        const response = await fetch(
            SUPABASE_URL +
            "/auth/v1/token?grant_type=password",

            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error_description ||
                data.msg ||
                data.message ||
                "Login fehlgeschlagen."
            );
        }


        accessToken =
            data.access_token;


        document
            .getElementById("loginPage")
            .classList.add("hidden");


        document
            .getElementById("adminPage")
            .classList.remove("hidden");


        status.textContent =
            "";


        // Version und Datum laden

        loadVersion();

        setToday();

        loadChangelogs();

    }

    catch (error) {

        status.textContent =
            "Login fehlgeschlagen: " +
            error.message;

    }

}


// ==========================================
// HEUTIGES DATUM
// ==========================================

function setToday() {

    const dateInput =
        document.getElementById("date");


    if (!dateInput.value) {

        dateInput.value =
            new Date()
                .toISOString()
                .split("T")[0];

    }

}


// ==========================================
// LOGOUT
// ==========================================

function logout() {

    accessToken = null;
    editingId = null;


    document
        .getElementById("adminPage")
        .classList.add("hidden");


    document
        .getElementById("loginPage")
        .classList.remove("hidden");


    document
        .getElementById("email")
        .value = "";


    document
        .getElementById("password")
        .value = "";

}


// ==========================================
// CHANGELOG SPEICHERN
// ==========================================

async function saveChangelog() {

    const version =
        document
            .getElementById("version")
            .value
            .trim();


    const date =
        document
            .getElementById("date")
            .value;


    const changes =
        document
            .getElementById("changes")
            .value
            .trim();


    const status =
        document.getElementById("status");


    if (
        !version ||
        version.includes("konnte nicht geladen")
    ) {

        status.textContent =
            "Version konnte nicht geladen werden.";

        return;
    }


    if (!changes) {

        status.textContent =
            "Bitte Änderungen eingeben.";

        return;
    }


    status.textContent =
        editingId
            ? "Änderung wird gespeichert..."
            : "Speichere...";


    try {

        let response;


        if (editingId) {

            response = await fetch(

                SUPABASE_URL +
                "/rest/v1/changelogs?id=eq." +
                encodeURIComponent(editingId),

                {
                    method: "PATCH",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken,

                        "Prefer":
                            "return=minimal"
                    },

                    body: JSON.stringify({

                        version:
                            version,

                        date:
                            date ||
                            new Date()
                                .toISOString()
                                .split("T")[0],

                        changes:
                            changes
                    })
                }
            );

        }

        else {

            response = await fetch(

                SUPABASE_URL +
                "/rest/v1/changelogs",

                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken,

                        "Prefer":
                            "return=minimal"
                    },

                    body: JSON.stringify({

                        version:
                            version,

                        date:
                            date ||
                            new Date()
                                .toISOString()
                                .split("T")[0],

                        changes:
                            changes
                    })
                }
            );

        }


        if (!response.ok) {

            const error =
                await response.text();

            throw new Error(error);
        }


        status.textContent =
            editingId
                ? "✓ Changelog geändert."
                : "✓ Changelog gespeichert.";


        cancelEdit();

        loadChangelogs();

    }

    catch (error) {

        status.textContent =
            "Fehler: " +
            error.message;
    }

}


// ==========================================
// CHANGELOGS LADEN
// ==========================================

async function loadChangelogs() {

    const container =
        document.getElementById("entries");


    try {

        const response = await fetch(

            SUPABASE_URL +
            "/rest/v1/changelogs?select=*&order=date.desc",

            {
                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        accessToken
                }
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                JSON.stringify(data)
            );
        }


        if (!data.length) {

            container.innerHTML =
                "<p>Noch keine Changelogs.</p>";

            return;
        }


        container.innerHTML =

            data.map(entry => `

                <div class="entry">

                    <h3>
                        ${escapeHtml(entry.version)}
                    </h3>

                    <div class="date">
                        ${escapeHtml(entry.date)}
                    </div>

                    <div class="changes">
                        ${escapeHtml(entry.changes)}
                    </div>

                    <div class="actions">

                        <button
                            class="primary editButton"
                            data-id="${entry.id}"
                            type="button"
                        >
                            BEARBEITEN
                        </button>

                        <button
                            class="danger deleteButton"
                            data-id="${entry.id}"
                            type="button"
                        >
                            LÖSCHEN
                        </button>

                    </div>

                </div>

            `).join("");


        document
            .querySelectorAll(".editButton")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    function() {

                        editChangelog(
                            this.dataset.id
                        );

                    }
                );

            });


        document
            .querySelectorAll(".deleteButton")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    function() {

                        deleteChangelog(
                            this.dataset.id
                        );

                    }
                );

            });

    }

    catch (error) {

        container.innerHTML =
            "Fehler beim Laden: " +
            error.message;

    }

}


// ==========================================
// CHANGELOG BEARBEITEN
// ==========================================

async function editChangelog(id) {

    try {

        const response = await fetch(

            SUPABASE_URL +
            "/rest/v1/changelogs?id=eq." +
            encodeURIComponent(id) +
            "&select=*",

            {
                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        accessToken
                }
            }
        );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.length
        ) {

            throw new Error(
                "Changelog konnte nicht geladen werden."
            );
        }


        const entry =
            data[0];


        editingId =
            entry.id;


        document
            .getElementById("version")
            .value =
            entry.version || "";


        document
            .getElementById("date")
            .value =
            entry.date || "";


        document
            .getElementById("changes")
            .value =
            entry.changes || "";


        document
            .getElementById("formTitle")
            .textContent =
            "Changelog bearbeiten";


        document
            .getElementById("cancelButton")
            .classList.remove("hidden");


        document
            .getElementById("status")
            .textContent =
            "Bearbeite " +
            entry.version;


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }

    catch (error) {

        document
            .getElementById("status")
            .textContent =
            "Fehler: " +
            error.message;

    }

}


// ==========================================
// BEARBEITEN ABBRECHEN
// ==========================================

function cancelEdit() {

    editingId = null;


    document
        .getElementById("formTitle")
        .textContent =
        "Neuer Changelog";


    document
        .getElementById("version")
        .value = "";


    document
        .getElementById("date")
        .value = "";


    document
        .getElementById("changes")
        .value = "";


    document
        .getElementById("cancelButton")
        .classList.add("hidden");


    // Neue Version erneut laden

    loadVersion();

    setToday();

}


// ==========================================
// CHANGELOG LÖSCHEN
// ==========================================

async function deleteChangelog(id) {

    if (
        !confirm(
            "Diesen Changelog wirklich löschen?"
        )
    ) {

        return;

    }


    const status =
        document.getElementById("status");


    status.textContent =
        "Lösche...";


    try {

        const response = await fetch(

            SUPABASE_URL +
            "/rest/v1/changelogs?id=eq." +
            encodeURIComponent(id),

            {
                method: "DELETE",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        accessToken,

                    "Prefer":
                        "return=minimal"
                }
            }
        );


        if (!response.ok) {

            const error =
                await response.text();

            throw new Error(error);

        }


        status.textContent =
            "✓ Changelog gelöscht.";


        loadChangelogs();

    }

    catch (error) {

        status.textContent =
            "Fehler: " +
            error.message;

    }

}


// ==========================================
// HTML SICHER MACHEN
// ==========================================

function escapeHtml(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


// ==========================================
// BUTTONS VERBINDEN
// ==========================================

document
    .getElementById("loginButton")
    .addEventListener(
        "click",
        adminLogin
    );


document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        logout
    );


document
    .getElementById("saveButton")
    .addEventListener(
        "click",
        saveChangelog
    );


document
    .getElementById("cancelButton")
    .addEventListener(
        "click",
        cancelEdit
    );

</script>
