<script>

const SUPABASE_URL =
"https://bnrawlkikbqkvdtkaauz.supabase.co";

const SUPABASE_KEY =

let accessToken = null;
let editingId = null;


// ==============================
// LOGIN
// ==============================

async function login() {

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const status =
        document.getElementById("loginStatus");

    status.textContent = "Login...";

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/auth/v1/token?grant_type=password",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error_description ||
                data.msg ||
                "Login fehlgeschlagen."
            );

        }

        accessToken =
            data.access_token;

        document
            .getElementById("login")
            .classList.add("hidden");

        document
            .getElementById("admin")
            .classList.remove("hidden");

        loadChangelogs();

    }

    catch (error) {

        status.textContent =
            error.message;

    }

}


// ==============================
// LOGOUT
// ==============================

function logout() {

    accessToken = null;

    cancelEdit();

    document
        .getElementById("admin")
        .classList.add("hidden");

    document
        .getElementById("login")
        .classList.remove("hidden");

}


// ==============================
// CHANGELOG SPEICHERN / BEARBEITEN
// ==============================

async function saveChangelog() {

    const version =
        document.getElementById("version").value.trim();

    const date =
        document.getElementById("date").value;

    const changes =
        document.getElementById("changes").value.trim();

    const status =
        document.getElementById("status");


    if (!version || !changes) {

        status.textContent =
            "Version und Änderungen ausfüllen.";

        return;

    }


    status.textContent =
        editingId
            ? "Änderung wird gespeichert..."
            : "Speichere...";


    try {

        let response;


        // ==========================
        // BEARBEITEN
        // ==========================

        if (editingId) {

            response = await fetch(
                SUPABASE_URL +
                "/rest/v1/changelogs?id=eq." +
                encodeURIComponent(editingId),
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type": "application/json",

                        "apikey": SUPABASE_KEY,

                        "Authorization":
                            "Bearer " + accessToken,

                        "Prefer":
                            "return=minimal"
                    },

                    body: JSON.stringify({

                        version: version,

                        date:
                            date ||
                            new Date()
                                .toISOString()
                                .split("T")[0],

                        changes: changes

                    })
                }
            );

        }


        // ==========================
        // NEU ERSTELLEN
        // ==========================

        else {

            response = await fetch(
                SUPABASE_URL +
                "/rest/v1/changelogs",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",

                        "apikey": SUPABASE_KEY,

                        "Authorization":
                            "Bearer " + accessToken,

                        "Prefer":
                            "return=minimal"
                    },

                    body: JSON.stringify({

                        version: version,

                        date:
                            date ||
                            new Date()
                                .toISOString()
                                .split("T")[0],

                        changes: changes

                    })
                }
            );

        }


        if (!response.ok) {

            const error =
                await response.text();

            throw new Error(error);

        }


        status.textContent =
            editingId
                ? "✓ Changelog geändert."
                : "✓ Changelog gespeichert.";


        cancelEdit();


        loadChangelogs();

    }

    catch (error) {

        status.textContent =
            "Fehler: " +
            error.message;

    }

}


// ==============================
// CHANGELOGS LADEN
// ==============================

async function loadChangelogs() {

    const container =
        document.getElementById("entries");


    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/changelogs?select=*&order=date.desc",
            {
                headers: {
                    "apikey": SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + accessToken
                }
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                JSON.stringify(data)
            );

        }


        if (!data.length) {

            container.innerHTML =
                "<p>Noch keine Changelogs.</p>";

            return;

        }


        container.innerHTML =
            data.map(entry => `

                <div class="entry">

                    <h3>
                        ${escapeHtml(entry.version)}
                    </h3>

                    <div class="date">
                        ${escapeHtml(entry.date)}
                    </div>

                    <div class="changes">
                        ${escapeHtml(entry.changes)}
                    </div>

                    <div class="actions">

                        <button
                            class="primary"
                            onclick="editChangelog('${entry.id}')"
                        >
                            BEARBEITEN
                        </button>

                        <button
                            class="danger"
                            onclick="deleteChangelog('${entry.id}')"
                        >
                            LÖSCHEN
                        </button>

                    </div>

                </div>

            `).join("");

    }
