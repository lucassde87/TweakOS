<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChugOS — Changelog</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
            padding: 40px 20px;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        a {
            color: white;
            text-decoration: none;
        }

        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: #999;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #999;
            margin-bottom: 40px;
        }

        .release {
            background: #15151b;
            border: 1px solid #292932;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .release h2 {
            margin: 0 0 5px;
        }

        .date {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .changes {
            white-space: pre-line;
            color: #ccc;
            line-height: 1.7;
        }

        .loading {
            color: #888;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="index.html" class="back">
        ← Zurück zu ChugOS
    </a>

    <h1>Changelog</h1>

    <p class="subtitle">
        Alle Updates und Verbesserungen von ChugOS.
    </p>

    <div id="changelog">
        <p class="loading">
            Changelogs werden geladen...
        </p>
    </div>

</div>


<script>

const SUPABASE_URL =
"https://bnrawlkikbqkvdtkaauz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VwtyXd-NuH_G4iwqb6WpqQ_BYZNlv2B";


async function loadChangelogs() {

    const container =
        document.getElementById("changelog");

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/changelogs?select=*&order=date.desc",
            {
                headers: {
                    "apikey": SUPABASE_KEY
                }
            }
        );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                JSON.stringify(data)
            );
        }

        if (!data.length) {

            container.innerHTML =
                "<p>Noch keine Changelogs vorhanden.</p>";

            return;
        }

        container.innerHTML =
            data.map(entry => `

                <article class="release">

                    <h2>
                        ${escapeHtml(entry.version)}
                    </h2>

                    <div class="date">
                        ${escapeHtml(entry.date)}
                    </div>

                    <div class="changes">
                        ${escapeHtml(entry.changes)}
                    </div>

                </article>

            `).join("");

    } catch (error) {

        container.innerHTML =
            "<p>Changelog konnte nicht geladen werden.</p>";

        console.error(error);
    }
}


function escapeHtml(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


loadChangelogs();

</script>

</body>
</html>
