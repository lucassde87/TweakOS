<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TweakOS Changelog</title><link rel="stylesheet" href="styles.css"></head><body><nav><b>TweakOS</b><div><a href="index.html">Download</a><a href="changelog.html">Changelog</a></div></nav><main><span class="pill">CHANGELOG</span><h1>Was ist neu?</h1><p class="muted">Automatisch aus deinen veröffentlichten Releases.</p><div id="list">Lade …</div></main><footer>© TweakOS</footer><script>fetch('https://api.github.com/repos/lucassde87/tweak/releases').then(r=>r.json()).then(rs=>document.getElementById('list').innerHTML=rs.slice(0,20).map(r=>'<article class="card"><div class="version">'+r.tag_name+'</div><h2>'+(r.name||'Update')+'</h2><p>'+((r.body||'Keine Notizen.').replaceAll('\n','<br>'))+'</p><small>'+new Date(r.published_at).toLocaleString('de-DE')+'</small></article>').join('')).catch(()=>document.getElementById('list').textContent='Changelog konnte nicht geladen werden.');</script></body></html>
